name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.14"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q 001_extract_unbound_text.py 002_prepare_translation_text.py 003_llm_translate.py 004_controlfix_translations.py 005_hybrid_injector.py 006_decontrolfix_translations.py lib patches scripts

      - name: Smoke-test command-line entry points
        run: |
          python 001_extract_unbound_text.py --help
          python 002_prepare_translation_text.py --help
          python 003_llm_translate.py --help
          python 004_controlfix_translations.py --help
          python 005_hybrid_injector.py --help
          python 006_decontrolfix_translations.py --help
          python scripts/create_bps.py --help

      - name: Run tests
        run: python -m pytest
